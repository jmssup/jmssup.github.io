<main class="shell" data-terminal aria-label="ssup 블로그 터미널">
  <div class="shell-session"><strong>jmssup</strong><span data-terminal-count>기록 불러오는 중</span></div>
  <div class="shell-screen" data-terminal-screen tabindex="0" role="region" aria-label="터미널 출력">
    <div class="shell-welcome">
      <h1>정명섭의 기록</h1>
      <p class="shell-tagline">개발과 보안을 공부하며 남긴 기록.</p>
      <p class="shell-start"><button type="button" data-terminal-command="about">about</button> 소개 <span>·</span> <button type="button" data-terminal-command="tree /">tree /</button> 전체 목차</p>
    </div>
    <div data-terminal-output></div>
  </div>
  <form class="shell-form" data-terminal-form autocomplete="off">
    <label for="shell-input" class="shell-prompt"><span>guest@ssup</span>:<span data-terminal-cwd>~</span>$</label>
    <input id="shell-input" name="command" aria-label="터미널 명령어" aria-describedby="shell-keyboard" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="home · ls · help" maxlength="500" disabled>
  </form>
  <div class="shell-statusbar" id="shell-keyboard"><span><button type="button" data-terminal-command="home">home</button> 처음 화면 <i>·</i> <button type="button" data-terminal-command="help">help</button> 명령어 안내 <i>·</i> <kbd>Enter</kbd> 실행</span><span><kbd>Tab</kbd> 자동완성 <i>·</i> <kbd>↑↓</kbd> 명령 기록 <i>·</i> <kbd>Esc</kbd> 입력 해제</span></div>
  <p class="sr-only" role="status" data-terminal-status></p>
  <noscript><p class="shell-noscript">이 블로그는 명령어로 탐색합니다. JavaScript를 켠 뒤 새로고침해 주세요.</p></noscript>
</main>
